name: Build and Test DSP Dialect

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    # Use ubuntu-24.04 to ensure GCC 13/14 is available for C++23 support
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout DSP Dialect
      uses: actions/checkout@v4
      with:
        path: dsp-dialect

    - name: Checkout LLVM Project
      uses: actions/checkout@v4
      with:
        # It is highly recommended to lock this to the specific CIRCT/LLVM commit you are using
        repository: llvm/llvm-project
        # ref: 'YOUR_SPECIFIC_LLVM_COMMIT_HASH_HERE' 
        path: llvm-project

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake ccache libtbb-dev

    - name: Setup Compiler Cache (ccache)
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ubuntu-24.04-ccache
        max-size: 2G

    - name: Cache LLVM Build
      id: cache-llvm
      uses: actions/cache@v4
      with:
        path: llvm-project/build
        # The cache key depends on the LLVM commit hash
        key: ${{ runner.os }}-llvm-build-v4-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-llvm-build-v4-

    - name: Build LLVM and MLIR
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      run: |
        cd llvm-project
        mkdir build
        cd build
        cmake -G Ninja ../llvm \
          -DLLVM_ENABLE_PROJECTS="mlir" \
          -DLLVM_TARGETS_TO_BUILD="Native;X86;NVPTX;AMDGPU" \
          -DMLIR_ENABLE_EXECUTION_ENGINE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_ASSERTIONS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DLLVM_INSTALL_UTILS=ON
        ninja mlir-libraries mlir-headers mlir-doc FileCheck count not mlir-cpu-runner mlir_c_runner_utils mlir_runner_utils

    - name: Build DSP Dialect
      run: |
        cd dsp-dialect
        mkdir build
        cd build
        cmake -G Ninja .. \
          -DMLIR_DIR=$GITHUB_WORKSPACE/llvm-project/build/lib/cmake/mlir \
          -DLLVM_EXTERNAL_LIT=$GITHUB_WORKSPACE/llvm-project/build/bin/llvm-lit \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        ninja

    - name: Run DSP Dialect Tests
      run: |
        cd dsp-dialect/build
        ninja check-dsp